<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 智能证据多路检索 · RAG 面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0b1326;
  --bg-card: #131b2e;
  --bg-input: #1a243c;
  --border-color: rgba(76, 215, 246, 0.18);
  --border-focus: #4cd7f6;
  --text-main: #dae2fd;
  --text-muted: #8b9bb4;
  --accent-cyan: #4cd7f6;
  --accent-blue: #2563eb;
  --accent-blue-hover: #1d4ed8;
  --danger-red: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background-color: var(--bg-main);
  background-image: 
    radial-gradient(ellipse at 80% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 80%, rgba(76, 215, 246, 0.08) 0%, transparent 50%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 30px rgba(37, 99, 235, 0.1);
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}

.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #2563eb, #4cd7f6, #2563eb);
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(37, 99, 235, 0.18);
  border: 1px solid rgba(76, 215, 246, 0.3);
  color: var(--accent-cyan);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.brand-title {
  font-size: 22px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.5px;
}

.brand-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
}

.error-box {
  background: var(--danger-bg);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 8px;
  padding: 10px 14px;
  color: #fca5a5;
  font-size: 13px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-main);
}

.input-wrapper {
  position: relative;
}

.form-control {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid rgba(139, 155, 180, 0.25);
  border-radius: 8px;
  color: #ffffff;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(76, 215, 246, 0.15);
  background: #1e2a47;
}

.form-control::placeholder {
  color: #64748b;
}

.submit-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 8px;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
}

.submit-btn:hover {
  background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
  transform: translateY(-1px);
}

.submit-btn:active {
  transform: translateY(0);
}

.account-tips {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid rgba(139, 155, 180, 0.15);
  font-size: 12px;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-badge">🏗️ 四川大型工程智能风控监管平台</div>
    <h1 class="brand-title">锐宝建设 RAG 知识中枢</h1>
    <p class="brand-subtitle">知识中枢与 RAG 引擎 V1.1</p>
  </div>

  <div id="errorMsg" class="error-box" style="display: none;">
    <span>⚠️</span>
    <span id="errorText"></span>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>系统账号</label>
      <div class="input-wrapper">
        <input type="text" id="username" class="form-control" placeholder="请输入用户名" required autofocus>
      </div>
    </div>
    
    <div class="form-group">
      <label>登录密码</label>
      <div class="input-wrapper">
        <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
      </div>
    </div>

    <button type="submit" class="submit-btn">进入系统</button>
  </form>

  <div class="account-tips">
    <div class="account-tips-title">💡 通用账号：chairman / admin / operator (密码 888888)</div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const errorBox = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    errorBox.style.display = 'none';
    
    try {
        const isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        // Connect to Tax backend (8921) to fetch token
        const apiUrl = isLocal ? 'http://127.0.0.1:8921/api/v1/auth/token' : '/api/v1/auth/token';
        
        const res = await fetch(apiUrl + '?username=' + encodeURIComponent(u) + '&password=' + encodeURIComponent(p), {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ username: u, password: p }) // keep body for compatibility
        });
        
        if (!res.ok) {
            let msg = '账号或密码错误';
            try { const errJson = await res.json(); msg = errJson.detail || msg; } catch(e){}
            throw new Error(msg);
        }
        
        const data = await res.json();
        document.cookie = `cdjg_rag_token=${data.access_token}; path=/; max-age=${data.expires_in}; SameSite=Lax`;
        window.location.href = '/';
    } catch (err) {
        errorText.textContent = err.message;
        errorBox.style.display = 'flex';
    }
});
</script>
</body>
</html>
