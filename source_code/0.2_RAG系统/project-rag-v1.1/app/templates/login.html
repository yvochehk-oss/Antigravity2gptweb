<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 智能证据多路检索 · RAG 面板</title>
<link rel="stylesheet" href="/static/fonts/index.css">
<style>
:root {
  --bg-app: #0b1326;
  --surface-card: #1a2540;
  --surface-2: #1e2d4d;
  --border-default: #2a3a5c;
  --brand: #3b82f6;
  --brand-hover: #2563eb;
  --brand-muted: rgba(59, 130, 246, 0.15);
  --text-primary: #e8eef7;
  --text-secondary: #8899b4;
  --text-muted: #5a6a82;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;
  --font-sans: "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-card {
  background: var(--surface-card);
  border: 1px solid var(--border-default);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 16px 32px rgba(0, 0, 0, 0.28);
}

.brand-header {
  text-align: center;
  margin-bottom: 28px;
}

.brand-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--brand-muted);
  border: 1px solid var(--border-default);
  color: var(--brand);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.brand-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.5px;
}

.brand-subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 6px;
}

.error-box {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.35);
  border-radius: 8px;
  padding: 10px 14px;
  color: #fecaca;
  font-size: 13px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.input-wrapper {
  position: relative;
}

.form-control {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border-default);
  border-radius: 8px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-muted);
  background: var(--surface-2);
}

.form-control::placeholder {
  color: var(--text-muted);
}

.submit-btn {
  width: 100%;
  padding: 12px;
  background: var(--brand);
  color: #ffffff;
  border: 1px solid var(--brand);
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s ease, border-color 0.2s ease;
  margin-top: 8px;
}

.submit-btn:hover {
  background: var(--brand-hover);
  border-color: var(--brand-hover);
}

.submit-btn:active {
  background: var(--brand-hover);
}

.account-tips {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border-default);
  font-size: 12px;
  color: var(--text-secondary);
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-badge">🏗️ 四川大型工程智能风控监管平台</div>
    <h1 class="brand-title">锐宝建设 RAG 知识中枢</h1>
    <p class="brand-subtitle">知识中枢与 RAG 引擎 V1.1</p>
  </div>

  <div id="errorMsg" class="error-box" style="display: none;">
    <span>⚠️</span>
    <span id="errorText"></span>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label>系统账号</label>
      <div class="input-wrapper">
        <input type="text" id="username" class="form-control" placeholder="请输入用户名" required autofocus>
      </div>
    </div>
    
    <div class="form-group">
      <label>登录密码</label>
      <div class="input-wrapper">
        <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
      </div>
    </div>

    <button type="submit" class="submit-btn">进入系统</button>
  </form>

  <div class="account-tips">
    <div class="account-tips-title">💡 账号由统一用户中心管理，请使用已分配的系统账号登录。</div>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const errorBox = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    errorBox.style.display = 'none';
    
    try {
        // Use the same-origin bridge. The server forwards credentials to Tax;
        // the Tax access token is returned only as an HttpOnly cookie.
        const res = await fetch('/api/v1/auth/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        
        if (!res.ok) {
            let msg = '账号或密码错误';
            try { const errJson = await res.json(); msg = errJson.detail || msg; } catch(e){}
            throw new Error(msg);
        }
        window.location.href = '/';
    } catch (err) {
        errorText.textContent = err instanceof Error ? err.message : '登录失败，请稍后重试';
        errorBox.style.display = 'flex';
    }
});
</script>
</body>
</html>
