# equipment business_role 补全计划（设备租赁，3 份）
regulations:
  # === 1. 建筑安装业个人所得税征收管理（国税总局令第44号）===
  - frontmatter:
      title: "建筑安装业个人所得税征收管理暂行办法(2018修正)"
      business_role: equipment
      document_no: "国家税务总局令第44号"
      issuer: "国家税务总局"
      legal_level: "部门规章"
      jurisdiction: "全国"
      tax_types: ["个人所得税"]
      industries: ["建筑业", "设备安装"]
      publish_date: "2018-06-15"
      effective_date: "2018-06-15"
      status: "现行有效"
      source: "国家税务总局"
      note: "建筑安装业（含设备安装）个人所得税全员全额扣缴申报"
    key_articles:
      - "第一条"
      - "第二条"
    summary: |
      设备安装业务按"建筑业"管理个税。设备租赁公司兼营安装业务的，个税处理须区分。

  # === 2. 增值税进项税额留抵退税（总局公告2025年第20号）===
  - frontmatter:
      title: "关于办理增值税期末留抵退税有关征管事项的公告"
      business_role: equipment
      document_no: "国家税务总局公告2025年第20号"
      issuer: "国家税务总局"
      legal_level: "规范性文件"
      jurisdiction: "全国"
      tax_types: ["增值税"]
      industries: ["全部行业"]
      publish_date: "2025-09-15"
      effective_date: "2025-10-01"
      status: "现行有效"
      source: "国家税务总局"
      note: "设备租赁公司购入大型设备（动辄千万）后，留抵退税是关键现金回笼通道"
    key_articles:
      - "第三条"
      - "第四条"
    summary: |
      设备租赁公司一次性投入设备金额大，进项留抵周期长，
      留抵退税政策直接影响现金流。

  # === 3. 跨地区经营企业所得税（财税〔2018〕32号）===
  - frontmatter:
      title: "关于企业所得税资产损失资料留存备查有关事项的公告"
      business_role: equipment
      document_no: "国家税务总局公告2018年第15号"
      issuer: "国家税务总局"
      legal_level: "规范性文件"
      jurisdiction: "全国"
      tax_types: ["企业所得税"]
      industries: ["全部行业"]
      publish_date: "2018-04-10"
      effective_date: "2018-01-01"
      status: "现行有效"
      source: "国家税务总局"
      note: "设备租赁公司设备折旧/减值/报废损失的企业所得税前扣除"
    key_articles:
      - "第一条"
      - "第二条"
    summary: |
      设备租赁公司的核心资产（塔吊、挖机等）折旧与减值损失，
      直接影响企业所得税前扣除。