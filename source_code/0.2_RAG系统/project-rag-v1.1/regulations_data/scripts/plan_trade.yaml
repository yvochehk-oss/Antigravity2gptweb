# trade business_role 补全计划（建材商贸，3 份）
regulations:
  # === 1. 农产品增值税进项税额核定扣除（财税〔2012〕38号）===
  - frontmatter:
      title: "关于在部分行业试行农产品增值税进项税额核定扣除办法的通知"
      business_role: trade
      document_no: "财税〔2012〕38号"
      issuer: "财政部 国家税务总局"
      legal_level: "规范性文件"
      jurisdiction: "全国"
      tax_types: ["增值税"]
      industries: ["建材", "农产品加工"]
      publish_date: "2012-04-17"
      effective_date: "2012-07-01"
      status: "现行有效"
      source: "财政部"
      note: "建材企业购进砂石/砖瓦等农产品时，按核定扣除办法计算进项税"
    key_articles:
      - "第一条"
      - "第二条"
      - "第三条"
    summary: |
      农产品核定扣除进项税是建材商贸企业（购进砂石、砖瓦等农产品）
      的核心抵扣政策，区别于凭票抵扣。

  # === 2. 货物运输业增值税进项抵扣（总局公告2006年第2号）===
  - frontmatter:
      title: "关于公路、内河货物运输业统一发票增值税抵扣有关问题的公告"
      business_role: trade
      document_no: "国家税务总局公告2006年第2号"
      issuer: "国家税务总局"
      legal_level: "规范性文件"
      jurisdiction: "全国"
      tax_types: ["增值税"]
      industries: ["建材", "运输"]
      publish_date: "2006-01-10"
      effective_date: "2006-01-01"
      status: "现行有效"
      source: "国家税务总局"
      note: "建材企业取得货物运输发票的增值税抵扣口径"
    key_articles:
      - "第一条"
      - "第二条"
    summary: |
      建材商贸企业购进大宗物资时，运输费占成本比重大，
      货物运输发票的抵扣口径直接影响进项税。

  # === 3. 增值税进项税额留抵退税（总局公告2025年第20号）===
  - frontmatter:
      title: "关于办理增值税期末留抵退税有关征管事项的公告"
      business_role: trade
      document_no: "国家税务总局公告2025年第20号"
      issuer: "国家税务总局"
      legal_level: "规范性文件"
      jurisdiction: "全国"
      tax_types: ["增值税"]
      industries: ["全部行业"]
      publish_date: "2025-09-15"
      effective_date: "2025-10-01"
      status: "现行有效"
      source: "国家税务总局"
      note: "建材商贸企业期末留抵税额退税申请操作细则"
    key_articles:
      - "第一条"
      - "第二条"
    summary: |
      增值税期末留抵退税的政策延续与征管调整。
      对建材商贸企业（季节性囤货）影响重大。