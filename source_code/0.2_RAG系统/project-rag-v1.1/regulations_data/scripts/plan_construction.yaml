# construction business_role 补全计划（建筑业总包，2 份新规）
regulations:
  # === 1. 中华人民共和国增值税法（主席令第41号）===
  - frontmatter:
      title: "中华人民共和国增值税法"
      business_role: construction
      document_no: "主席令第四十一号"
      issuer: "全国人民代表大会常务委员会"
      legal_level: "法律"
      jurisdiction: "全国"
      tax_types: ["增值税"]
      industries: ["建筑业", "全部行业"]
      publish_date: "2025-12-30"
      effective_date: "2026-01-01"
      status: "现行有效"
      source: "全国人大常委会"
      note: "本法替代原《中华人民共和国增值税暂行条例》"
    key_articles:
      - "第一条"
      - "第二条"
      - "第九条"
      - "第十一条"
      - "第十四条"
    summary: |
      本法是增值税领域的基本法律，2026 年 1 月 1 日起施行，
      标志着我国增值税制度从「暂行条例」升级为「法律」。
      对建筑业而言，需关注税率/征收率、纳税义务发生时间、
      进项抵扣、跨地区预缴等核心条款。

  # === 2. 异地预缴城建税与教育费附加（财税〔2016〕74号）===
  - frontmatter:
      title: "关于纳税人异地预缴增值税有关城市维护建设税和教育费附加政策问题的通知"
      business_role: construction
      document_no: "财税〔2016〕74号"
      issuer: "财政部 国家税务总局"
      legal_level: "规范性文件"
      jurisdiction: "全国"
      tax_types: ["城建税", "教育费附加"]
      industries: ["建筑业", "全部行业"]
      publish_date: "2016-05-10"
      effective_date: "2016-05-01"
      status: "现行有效"
      source: "财政部"
      note: "建筑企业跨地区提供建筑服务预缴增值税时，城建税/教育费附加同步在预缴地缴纳"
    key_articles:
      - "第一条"
      - "第二条"
    summary: |
      明确纳税人跨县市区提供建筑服务预缴增值税时，
      城建税和教育费附加随同增值税在预缴地缴纳，
      不再回机构所在地申报。