[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-rag"
version = "1.1.0"
description = "Project Knowledge RAG Service (merged v0.2-optimized + v1.0 facts/ai_review + v0.2 regulation retrieval, HTTP bridge)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "成都建工 RAG Team" }
]

dependencies = [
    # Core (v0.2-optimized + v1.0 合并)
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.11,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "webauthn>=3.0.0",
    "pymupdf>=1.28.2",
    # Local-only OCR backend used by mineru_mock.py. The parser supplies
    # explicit model paths and never permits the package to download defaults.
    "rapidocr-onnxruntime>=1.4,<2",
    # 1.24+ no longer ships CPython 3.10 wheels; this RAG release targets 3.10.
    "onnxruntime>=1.17,<1.24",
    "flagembedding>=1.4.2",
    # Document and spreadsheet parsers for entity and voucher ingestion
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "xlrd>=2.0.1",
    "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4,<1",
]
metabase = [
    "httpx>=0.27.0",
]

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "facts_provider*", "ai_review*", "adapters*", "analytics_contract*"]
exclude = ["tests*", "sql*", "schemas*", "docs*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["analytics_contract/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
# The SQLite suite is historical and must not be part of the PostgreSQL-only
# default gate. It remains selectable explicitly for historical inspection with:
#   pytest -o addopts='' tests/_archive_sqlite
addopts = "-q --ignore=scripts --ignore=tests/_archive_sqlite"
markers = [
    "postgresql: requires the disposable PostgreSQL test database",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",  # line too long (handled by formatter/line-length)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
