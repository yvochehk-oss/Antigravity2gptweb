{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>主数据管理</h2>
<form method="post" action="/manage/cost" class="row">
<input type="hidden" name="_csrf" value="{{ csrf_token }}">
<select name="project_id">{% for p in projects %}<option value="{{ p.id }}">{{ p.code }}</option>{% endfor %}</select>
<select name="entity_code" required aria-label="承担法人">
  <option value="" disabled selected>选择承担法人（实际主体）</option>
  {% for e in entities %}
    <option value="{{ e.code }}">{{ e.code }} · {{ e.name }} · 业务角色 {{ e.business_role }}{% if not e.legal_entity %} · 分支机构{% endif %}</option>
  {% endfor %}
</select>
<input name="counterparty_code" placeholder="交易对手代码（外部方用 EXT-*；空=自承担)">
<select name="category"><option>材料</option><option>劳务</option><option>设备</option><option>专业分包</option><option>项目管理</option></select>
<input name="subcategory" placeholder="子科目">
<input name="period" placeholder="2026-08">
<input name="amount" type="number" step="0.01" placeholder="金额">
<label><input type="checkbox" name="external_cash" value="true"> 外部现金</label>
<input name="note" placeholder="说明">
<button>新增真实成本</button>
</form>
</div>

<div class="card">
<h3>发票 / 合同 / 付款</h3>
<p class="muted">
  发票、合同、付款数据<strong>强制从 RAG 知识库抽取</strong>，禁止手工录入。<br>
  请通过 <code>/rag-sync</code> 接口或驾驶舱 RAG 同步页面执行抽取。
</p>
</div>
{% endblock %}
