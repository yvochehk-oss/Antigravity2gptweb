[project]
name = "chengdu-construction-tax-system-v0.2"
version = "2.5"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.6",
    "structlog>=24.1",
    "pytest>=8.0",
    "ruff>=0.4",
    "pyjwt>=2.13.0",
    "psycopg2-binary>=2.9.12",
    "cryptography>=42.0,<48",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_archive_sqlite"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
