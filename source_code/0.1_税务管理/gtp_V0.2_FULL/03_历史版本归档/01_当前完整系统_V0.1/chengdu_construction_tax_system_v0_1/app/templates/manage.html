{% extends 'base.html' %}{% block body %}
<h1>业务录入</h1>
<div class="panel"><b>统一编号：</b>A施工 / B劳务 / C商贸 / D设备；甲劳务 / 乙设备 / 丙材料 / 丁专业分包及其他。</div>
<h2>真实成本</h2><form method="post" action="/manage/cost"><select name="project_id">{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><select name="entity_code">{% for e in entities %}<option value="{{e.code}}">{{e.code}} {{e.name}}</option>{% endfor %}</select><input name="counterparty_code" placeholder="成本来源/交易对手，可空"><input name="category" placeholder="material/labor/equipment"><input name="subcategory" placeholder="子科目"><input name="period" value="2026-08"><input type="number" step=".01" name="amount" placeholder="金额"><label><input type="checkbox" name="external_cash">属于受控体系对外真实支出</label><input name="note" placeholder="说明"><button>保存成本</button></form>
<h2>合同</h2><form method="post" action="/manage/contract"><select name="project_id">{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="contract_no" placeholder="合同编号"><input name="buyer_code" placeholder="买方"><input name="seller_code" placeholder="卖方"><input name="category" placeholder="类别"><input type="number" step=".01" name="amount" placeholder="含税合同额"><input name="note" placeholder="说明"><button>保存合同</button></form>
<h2>发票</h2><form method="post" action="/manage/invoice"><select name="project_id">{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="invoice_no" placeholder="发票号"><input name="period" value="2026-08"><input name="entity_code" placeholder="本方法人A/B/C/D"><select name="direction"><option>in</option><option>out</option></select><input name="counterparty_code" placeholder="交易对手"><input name="category" placeholder="类别"><input type="number" step=".01" name="net" placeholder="不含税金额"><input type="number" step=".01" name="vat" placeholder="VAT"><input type="number" step=".0001" name="rate" placeholder="税率如.13"><label><input type="checkbox" name="deductible">可抵扣</label><button>保存发票</button></form>
<h2>资金流水</h2><form method="post" action="/manage/cashflow"><select name="project_id">{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="entity_code" placeholder="本方法人"><input name="counterparty_code" placeholder="交易对手"><select name="direction"><option>in</option><option>out</option></select><input type="number" step=".01" name="amount" placeholder="金额"><input name="period" value="2026-08"><input name="note" placeholder="建议写类别，如material付款"><button>保存流水</button></form>
<h2>履约证据</h2><form method="post" action="/manage/fulfillment"><select name="project_id">{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="counterparty_code" placeholder="交易对手"><select name="kind"><option>material_acceptance</option><option>labor_settlement</option><option>equipment_shift</option><option>other</option></select><input name="category" placeholder="material/labor/equipment/subcontract"><input type="number" step=".01" name="quantity" placeholder="数量/台班/人数"><input type="number" step=".01" name="amount" placeholder="结算金额"><label><input type="checkbox" name="evidence_complete">证据完整</label><input name="note" placeholder="说明"><button>保存履约</button></form>
{% endblock %}
