{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>外部模型 API 端点</h2>
<form method="post" action="/ai-models" class="row">
<input name="name" placeholder="名称">
<select name="adapter"><option>模拟</option><option>OpenAI兼容接口</option></select>
<input name="base_url" placeholder="https://api.example.com">
<input name="chat_path" value="/v1/chat/completions">
<input name="model" placeholder="模型名">
<input name="api_key_env" placeholder="TAX_AI_API_KEY">
<input name="timeout_seconds" type="number" value="90">
<input name="note" placeholder="备注">
<button>新增</button>
</form>
<p class="muted">API Key 仅保存环境变量名，不入库。</p>
</div>

<div class="card">
<table>
<thead><tr><th>#</th><th>名称</th><th>适配器</th><th>模型</th><th>Key环境变量</th><th>启用</th><th>操作</th></tr></thead>
<tbody>
{% for r in rows %}
<tr>
<td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.adapter }}</td>
<td>{{ r.model }}</td><td>{{ r.api_key_env }}</td>
<td><span class="tag {% if r.enabled %}green{% else %}gray{% endif %}">{{ "✓" if r.enabled else "✗" }}</span></td>
<td>
<form method="post" action="/ai-models/{{ r.id }}/toggle" class="inline">
<button class="secondary">{{ "禁用" if r.enabled else "启用" }}</button>
</form>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
