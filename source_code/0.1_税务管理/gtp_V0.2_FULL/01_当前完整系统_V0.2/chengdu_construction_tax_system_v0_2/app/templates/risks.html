{% extends "base.html" %}
{% block content %}
<div class="card">
<h2>风险中心</h2>
<form method="get" class="row">
<select name="project_id">{% for p in projects %}<option value="{{ p.id }}" {% if pid==p.id %}selected{% endif %}>{{ p.code }}</option>{% endfor %}</select>
<button>扫描</button>
</form>
</div>
<div class="card">
<table>
<thead><tr><th>严重度</th><th>风险类别</th><th>描述</th></tr></thead>
<tbody>
{% for r in rows %}
<tr class="{% if r.severity == 'RED' %}risk-red{% elif r.severity == 'YELLOW' %}risk-yellow{% else %}risk-gray{% endif %}">
<td><span class="tag {% if r.severity == 'RED' %}red{% elif r.severity == 'YELLOW' %}yellow{% else %}gray{% endif %}">{{ severity_labels.get(r.severity, r.severity) }}</span></td>
<td>{{ risk_code_labels.get(r.code, r.code) }}</td>
<td>{{ r.message }}</td>
</tr>
{% else %}
<tr><td colspan="3" class="muted">未发现风险</td></tr>
{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
