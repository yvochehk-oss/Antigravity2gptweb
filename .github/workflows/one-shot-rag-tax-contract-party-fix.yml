name: One-shot RAG Tax contract identity fix

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/one-shot-rag-tax-contract-party-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Apply RAG and Tax identity-boundary patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          rag_root = Path("source_code/0.2_RAG系统/project-rag-v1.1")
          tax_root = Path("source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0")

          entities = rag_root / "app/domain/entities.py"
          rag_routes = rag_root / "app/legacy_routes.py"
          rag_tests = rag_root / "tests/test_external_party_alias_normalization.py"
          tax_sync = tax_root / "app/routers/rag_sync.py"
          tax_tests = tax_root / "tests/test_rag_sync_contract_party_aliases.py"

          # 1) RAG canonical alias registry: names/short names are valid input identities,
          #    but only canonical E* codes are persisted/transferred.
          text = entities.read_text(encoding="utf-8")
          old = '''        "aliases": ("EXT-PG", "EB01", "EB1", "攀钢", "攀钢集团", "合金钢直采"),\n'''
          new = '''        "aliases": ("EXT-PG", "EB01", "EB1", "攀钢", "攀钢集团", "合金钢直采", "攀钢集团攀枝花钢铁钒物资销售有限公司"),\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("EB alias anchor not found")

          old = '''        "aliases": ("EXT-CQ", "EXT-CQ-HEAVY-CRANE", "EXT-CRANE", "ED01", "ED1", "重庆巨力", "巨力吊装", "重交大件", "履带吊租赁", "超重型履带吊"),\n'''
          new = '''        "aliases": ("EXT-CQ", "EXT-CQ-HEAVY-CRANE", "EXT-CRANE", "ED01", "ED1", "重庆巨力", "巨力吊装", "重交大件", "重庆重交大件起重吊装工程有限公司", "履带吊租赁", "超重型履带吊"),\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("ED alias anchor not found")

          old = '''EXTERNAL_ALIAS_TO_CODE: dict[str, str] = {}\nfor _k, _meta in EXTERNAL_ENTITY_PRESETS.items():\n    EXTERNAL_ALIAS_TO_CODE[_k] = _k\n    for _al in _meta.get("aliases", ()):\n        EXTERNAL_ALIAS_TO_CODE[_al.upper()] = _k\n'''
          new = '''EXTERNAL_ALIAS_TO_CODE: dict[str, str] = {}\nfor _k, _meta in EXTERNAL_ENTITY_PRESETS.items():\n    for _identity in (\n        _k,\n        _meta.get("name"),\n        _meta.get("short_name"),\n        *_meta.get("aliases", ()),\n    ):\n        if _identity:\n            EXTERNAL_ALIAS_TO_CODE[str(_identity).strip().upper()] = _k\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("external alias registry anchor not found")
          entities.write_text(text, encoding="utf-8")

          # 2) RAG contract extraction compatibility: emit both canonical code names.
          text = rag_routes.read_text(encoding="utf-8")
          helper_anchor = '''    return max(1, min(configured, 8))\n\n# Import v1.0 legacy modules\n'''
          helper = '''    return max(1, min(configured, 8))\n\n\ndef _inject_contract_party_codes(fields: dict, doc) -> dict:\n    """Backfill canonical party codes for both old and new Tax consumers."""\n    if doc.entity_code:\n        fields.setdefault("party_a_entity_code", doc.entity_code)\n        fields.setdefault("party_a_code", doc.entity_code)\n    if doc.counterparty_code:\n        canonical = map_to_standard_external_code(doc.counterparty_code)\n        if canonical:\n            fields.setdefault("party_b_entity_code", canonical)\n            fields.setdefault("party_b_code", canonical)\n    return fields\n\n\n# Import v1.0 legacy modules\n'''
          if "def _inject_contract_party_codes(" not in text:
              if helper_anchor not in text:
                  raise SystemExit("RAG helper insertion anchor not found")
              text = text.replace(helper_anchor, helper, 1)

          old = '''                        if doc.entity_code and not fields.get("party_a_entity_code"):\n                            fields["party_a_entity_code"] = doc.entity_code\n                        if doc.counterparty_code and not fields.get("party_b_entity_code"):\n                            fields["party_b_entity_code"] = doc.counterparty_code\n'''
          new = '''                        _inject_contract_party_codes(fields, doc)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("RAG contract compatibility anchor not found")
          rag_routes.write_text(text, encoding="utf-8")

          # 3) Tax defense-in-depth: prefer RAG canonical *_entity_code, then exact
          #    explicit seal-name aliases. Never fuzzy-guess a legal counterparty.
          text = tax_sync.read_text(encoding="utf-8")
          clean_anchor = '''def _clean_identity(value: Any) -> str:\n    """Normalize an extracted identity without changing its business value."""\n    if value is None:\n        return ""\n    return " ".join(str(value).strip().split())\n\n\ndef _is_virtual_identity(value: str | None) -> bool:\n'''
          clean_replacement = '''def _clean_identity(value: Any) -> str:\n    """Normalize an extracted identity without changing its business value."""\n    if value is None:\n        return ""\n    return " ".join(str(value).strip().split())\n\n\n_EXTERNAL_PARTY_SEAL_NAME_TO_CODE = {\n    "四川省建筑科学研究院特种技术服务中心": "EA",\n    "攀钢集团攀枝花钢铁钒物资销售有限公司": "EB",\n    "重庆重交大件起重吊装工程有限公司": "ED",\n}\n\n\ndef _normalize_contract_party_identity(\n    fields: dict[str, Any], side: str,\n) -> tuple[str, str, str, str]:\n    """Return canonical code/tax-id/name plus a matched explicit seal alias code."""\n    code = _clean_identity(\n        fields.get(f"{side}_entity_code") or fields.get(f"{side}_code")\n    )\n    tax_id = _clean_identity(fields.get(f"{side}_tax_id"))\n    name = _clean_identity(fields.get(f"{side}_name"))\n    alias_code = _EXTERNAL_PARTY_SEAL_NAME_TO_CODE.get(name, "")\n    if alias_code:\n        if code and code != alias_code:\n            raise SyncReviewRequired(\n                f"{side} canonical code {code!r} 与公章全称 {name!r} 映射 {alias_code!r} 冲突"\n            )\n        code = alias_code\n        fields[f"{side}_entity_code"] = alias_code\n        fields[f"{side}_code"] = alias_code\n    elif code:\n        fields[f"{side}_code"] = code\n    return code, tax_id, name, alias_code\n\n\ndef _is_virtual_identity(value: str | None) -> bool:\n'''
          if "_EXTERNAL_PARTY_SEAL_NAME_TO_CODE" not in text:
              if clean_anchor not in text:
                  raise SystemExit("Tax identity helper anchor not found")
              text = text.replace(clean_anchor, clean_replacement, 1)

          old = '''    party_a_code = _clean_identity(fields.get("party_a_code"))\n    party_a_tax_id = _clean_identity(fields.get("party_a_tax_id"))\n    party_b_code = _clean_identity(fields.get("party_b_code"))\n    party_b_tax_id = _clean_identity(fields.get("party_b_tax_id"))\n    # Some extractors put the tax id into ``*_code``.  Passing that value as\n    # both a code and tax id would intentionally fail the identity resolver;\n    # keep the one authoritative identifier instead.\n    if party_a_tax_id and party_a_code == party_a_tax_id:\n        party_a_code = ""\n    if party_b_tax_id and party_b_code == party_b_tax_id:\n        party_b_code = ""\n    party_a = _resolve_party_code(\n        db,\n        raw=party_a_code,\n        name=fields.get("party_a_name"),\n        tax_id=party_a_tax_id,\n    )\n    party_b = _resolve_party_code(\n        db,\n        raw=party_b_code,\n        name=fields.get("party_b_name"),\n        tax_id=party_b_tax_id,\n    )\n'''
          new = '''    party_a_code, party_a_tax_id, party_a_name, party_a_alias = (\n        _normalize_contract_party_identity(fields, "party_a")\n    )\n    party_b_code, party_b_tax_id, party_b_name, party_b_alias = (\n        _normalize_contract_party_identity(fields, "party_b")\n    )\n    # Some extractors put the tax id into ``*_code``.  Passing that value as\n    # both a code and tax id would intentionally fail the identity resolver;\n    # keep the one authoritative identifier instead.\n    if party_a_tax_id and party_a_code == party_a_tax_id:\n        party_a_code = ""\n    if party_b_tax_id and party_b_code == party_b_tax_id:\n        party_b_code = ""\n    party_a = _resolve_party_code(\n        db,\n        raw=party_a_code,\n        name="" if party_a_alias else party_a_name,\n        tax_id=party_a_tax_id,\n    )\n    party_b = _resolve_party_code(\n        db,\n        raw=party_b_code,\n        name="" if party_b_alias else party_b_name,\n        tax_id=party_b_tax_id,\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Tax contract mapper anchor not found")

          old = '''    created: list[ExternalParty] = []\n    for side in ("party_a", "party_b"):\n        raw_code = _clean_identity(fields.get(f"{side}_code"))\n        raw_tax_id = _clean_identity(fields.get(f"{side}_tax_id"))\n        name = _clean_identity(fields.get(f"{side}_name"))\n        if not raw_tax_id and not raw_code:\n            continue\n        try:\n            _resolve_party_code(db, raw=raw_code, tax_id=raw_tax_id, name=name)\n            continue\n'''
          new = '''    created: list[ExternalParty] = []\n    for side in ("party_a", "party_b"):\n        raw_code, raw_tax_id, name, alias_code = _normalize_contract_party_identity(\n            fields, side\n        )\n        if not raw_tax_id and not raw_code:\n            continue\n        try:\n            _resolve_party_code(\n                db,\n                raw=raw_code,\n                tax_id=raw_tax_id,\n                name="" if alias_code else name,\n            )\n            continue\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Tax confirm-party anchor not found")
          tax_sync.write_text(text, encoding="utf-8")

          # 4) RAG focused regressions.
          text = rag_tests.read_text(encoding="utf-8")
          if "_inject_contract_party_codes" not in text:
              text = text.replace(
                  "from app.legacy_routes import app, api_patch_metadata\n",
                  "from app.legacy_routes import app, api_patch_metadata, _inject_contract_party_codes\n",
                  1,
              )
          if "def test_seal_legal_names_map_to_canonical_external_code" not in text:
              text += '''\n\n@pytest.mark.parametrize(\n    ("name", "expected"),\n    [\n        ("四川省建筑科学研究院特种技术服务中心", "EA"),\n        ("攀钢集团攀枝花钢铁钒物资销售有限公司", "EB"),\n        ("重庆重交大件起重吊装工程有限公司", "ED"),\n    ],\n)\ndef test_seal_legal_names_map_to_canonical_external_code(name, expected) -> None:\n    assert map_to_standard_external_code(name) == expected\n\n\ndef test_contract_extract_backfills_both_code_field_names() -> None:\n    class _Doc:\n        entity_code = "A08"\n        counterparty_code = "EXT-CQ"\n\n    fields = {}\n    _inject_contract_party_codes(fields, _Doc())\n\n    assert fields["party_a_entity_code"] == "A08"\n    assert fields["party_a_code"] == "A08"\n    assert fields["party_b_entity_code"] == "ED"\n    assert fields["party_b_code"] == "ED"\n'''
          rag_tests.write_text(text, encoding="utf-8")

          # 5) Tax focused regressions for schema compatibility, seal aliases,
          #    mapper behavior, and confirmation without duplicate creation.
          tax_test_content = '''"""Regression tests for canonical RAG contract counterparty identities."""\n\nimport pytest\n\nfrom app.routers import rag_sync\n\n\n@pytest.mark.parametrize(\n    ("name", "expected"),\n    [\n        ("四川省建筑科学研究院特种技术服务中心", "EA"),\n        ("攀钢集团攀枝花钢铁钒物资销售有限公司", "EB"),\n        ("重庆重交大件起重吊装工程有限公司", "ED"),\n    ],\n)\ndef test_contract_seal_name_normalizes_to_canonical_code(name, expected) -> None:\n    fields = {"party_b_name": name}\n    code, tax_id, normalized_name, alias_code = (\n        rag_sync._normalize_contract_party_identity(fields, "party_b")\n    )\n    assert code == expected\n    assert alias_code == expected\n    assert tax_id == ""\n    assert normalized_name == name\n    assert fields["party_b_code"] == expected\n    assert fields["party_b_entity_code"] == expected\n\n\ndef test_contract_identity_prefers_rag_entity_code() -> None:\n    fields = {\n        "party_b_entity_code": "EB",\n        "party_b_code": "legacy-or-tax-id",\n        "party_b_name": "攀钢集团攀枝花钢铁钒物资销售有限公司",\n    }\n    code, _tax_id, _name, alias_code = rag_sync._normalize_contract_party_identity(\n        fields, "party_b"\n    )\n    assert code == "EB"\n    assert alias_code == "EB"\n    assert fields["party_b_code"] == "EB"\n\n\ndef test_map_contract_fields_uses_canonical_code_for_known_seal_alias(monkeypatch) -> None:\n    calls = []\n\n    def _fake_resolve(db, raw=None, *, name=None, code=None, tax_id=None):\n        calls.append({"raw": raw, "name": name, "code": code, "tax_id": tax_id})\n        return raw or code\n\n    monkeypatch.setattr(rag_sync, "_resolve_party_code", _fake_resolve)\n    monkeypatch.setattr(rag_sync, "_is_internal_entity_code", lambda db, code: code == "A08")\n\n    fields = {\n        "party_a_entity_code": "A08",\n        "party_a_name": "内部施工主体",\n        "party_b_entity_code": "EB",\n        "party_b_name": "攀钢集团攀枝花钢铁钒物资销售有限公司",\n        "contract_no": "TF-A08-EXT-PG",\n        "total_amount": "100.00",\n    }\n    mapped = rag_sync._map_contract_fields(object(), fields, 1)\n\n    assert mapped["buyer_code"] == "A08"\n    assert mapped["seller_code"] == "EB"\n    assert calls[1]["raw"] == "EB"\n    assert calls[1]["name"] == ""\n\n\ndef test_confirm_existing_alias_party_does_not_create_duplicate(monkeypatch) -> None:\n    monkeypatch.setattr(\n        rag_sync,\n        "_resolve_party_code",\n        lambda db, raw=None, *, name=None, code=None, tax_id=None: raw or code,\n    )\n    fields = {\n        "party_b_entity_code": "ED",\n        "party_b_name": "重庆重交大件起重吊装工程有限公司",\n    }\n\n    created = rag_sync._create_confirmed_external_parties(object(), fields)\n\n    assert created == []\n    assert fields["party_b_code"] == "ED"\n    assert fields["party_b_entity_code"] == "ED"\n\n\ndef test_contract_alias_conflict_fails_closed() -> None:\n    fields = {\n        "party_b_entity_code": "EA",\n        "party_b_name": "攀钢集团攀枝花钢铁钒物资销售有限公司",\n    }\n    with pytest.raises(rag_sync.SyncReviewRequired, match="冲突"):\n        rag_sync._normalize_contract_party_identity(fields, "party_b")\n'''
          tax_tests.write_text(tax_test_content, encoding="utf-8")

          for path in (entities, rag_routes, rag_tests, tax_sync, tax_tests):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          PY

      - name: Commit and push implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'source_code/0.2_RAG系统/project-rag-v1.1/app/domain/entities.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/app/legacy_routes.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/tests/test_external_party_alias_normalization.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/routers/rag_sync.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/tests/test_rag_sync_contract_party_aliases.py'
          if git diff --cached --quiet; then
            echo "No implementation patch required"
            exit 0
          fi
          git commit -m "fix(sync): preserve canonical external-party identity across RAG contract import"
          git pull --rebase origin v3.0-macos
          git push origin HEAD:v3.0-macos
