name: Repair Phase 2.5 One-shot

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/phase25-workflow-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 1
      - name: Repair generated-test quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          target = Path('.github/workflows/phase25-ssot-hardening.yml')
          text = target.read_text(encoding='utf-8')
          updated, count = re.subn(
              r'^\s*assert "existing\[.*superseded.*$',
              '              assert \'existing["status"] == "superseded"\' in source',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise RuntimeError(f'expected one quote repair, got {count}')
          target.write_text(updated, encoding='utf-8')
          PY
      - name: Commit repair and remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase25-workflow-fix.yml
          git add .github/workflows/phase25-ssot-hardening.yml
          git commit -m "chore: fix Phase 2.5 one-shot validation quoting"
          git push origin HEAD:v3.0-macos
