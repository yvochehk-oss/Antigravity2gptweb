name: One-shot RAG alias guard fix

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/one-shot-rag-alias-guard-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Apply minimal source and regression-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("source_code/0.2_RAG系统/project-rag-v1.1")
          legacy = root / "app/legacy_routes.py"
          tests = root / "tests/test_external_party_alias_normalization.py"

          legacy_text = legacy.read_text(encoding="utf-8")
          old_legacy = '''        d = db.get(Document, document_id)\n        changes = body.model_dump(exclude_none=True)\n'''
          new_legacy = '''        d = db.get(Document, document_id)\n        if not d:\n            raise HTTPException(404, "document not found")\n        changes = body.model_dump(exclude_none=True)\n'''
          if old_legacy not in legacy_text:
              if new_legacy not in legacy_text:
                  raise SystemExit("api_patch_metadata anchor not found")
          else:
              if legacy_text.count(old_legacy) != 1:
                  raise SystemExit("api_patch_metadata anchor is not unique")
              legacy_text = legacy_text.replace(old_legacy, new_legacy, 1)
              legacy.write_text(legacy_text, encoding="utf-8")

          test_text = tests.read_text(encoding="utf-8")
          if "from fastapi import HTTPException\n" not in test_text:
              import_anchor = "import pytest\nfrom fastapi.testclient import TestClient\n"
              import_replacement = "import pytest\nfrom fastapi import HTTPException\nfrom fastapi.testclient import TestClient\n"
              if import_anchor not in test_text:
                  raise SystemExit("FastAPI import anchor not found")
              test_text = test_text.replace(import_anchor, import_replacement, 1)

          test_name = "def test_api_patch_metadata_missing_document_returns_404(monkeypatch) -> None:"
          if test_name not in test_text:
              insert_anchor = "\n\ndef test_register_bytes_initial_commit_normalizes_to_ed(monkeypatch) -> None:\n"
              new_test = '''\n\ndef test_api_patch_metadata_missing_document_returns_404(monkeypatch) -> None:\n    class _MockDB:\n        def get(self, model, doc_id):\n            return None\n\n    @contextmanager\n    def _mock_get_db():\n        yield _MockDB()\n\n    monkeypatch.setattr("app.legacy_routes.get_db", _mock_get_db)\n\n    patch = DocumentMetadataPatch(counterparty_code="EXT-CQ")\n    with pytest.raises(HTTPException) as exc_info:\n        api_patch_metadata(404404, patch)\n\n    assert exc_info.value.status_code == 404\n    assert exc_info.value.detail == "document not found"\n'''
              if insert_anchor not in test_text:
                  raise SystemExit("regression-test insert anchor not found")
              test_text = test_text.replace(insert_anchor, new_test + insert_anchor, 1)

          tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Commit and push patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'source_code/0.2_RAG系统/project-rag-v1.1/app/legacy_routes.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/tests/test_external_party_alias_normalization.py'
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix(rag): restore metadata patch 404 guard and regression test"
          git pull --rebase origin v3.0-macos
          git push origin HEAD:v3.0-macos
