name: Canonical Branch Mirror

on:
  push:
    branches:
      - main
      - macos
      - windows
      - v3.0
      - v3.0-macos
      - v3.0-windows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-branch-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep platform refs on one canonical commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          case "$SOURCE_BRANCH" in
            main|macos|windows)
              GROUP=(main macos windows)
              ;;
            v3.0|v3.0-macos|v3.0-windows)
              GROUP=(v3.0 v3.0-macos v3.0-windows)
              ;;
            *)
              echo "Unsupported source branch: $SOURCE_BRANCH" >&2
              exit 1
              ;;
          esac

          git fetch origin "${GROUP[@]}" --prune
          SOURCE_SHA="$(git rev-parse "origin/${SOURCE_BRANCH}")"
          echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
          printf 'Mirror group: %s\n' "${GROUP[*]}"

          for branch in "${GROUP[@]}"; do
            [ "$branch" = "$SOURCE_BRANCH" ] && continue
            TARGET_SHA="$(git rev-parse "origin/${branch}")"

            if [ "$TARGET_SHA" = "$SOURCE_SHA" ]; then
              continue
            fi

            if ! git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then
              echo "Refusing to overwrite diverged branch ${branch}." >&2
              echo "${branch}: ${TARGET_SHA}" >&2
              echo "${SOURCE_BRANCH}: ${SOURCE_SHA}" >&2
              echo "Reconcile the commits into the canonical branch first, then rerun mirror." >&2
              exit 1
            fi
          done

          refs=()
          for branch in "${GROUP[@]}"; do
            [ "$branch" = "$SOURCE_BRANCH" ] && continue
            refs+=("${SOURCE_SHA}:refs/heads/${branch}")
          done

          git push --atomic origin "${refs[@]}"

          git fetch origin "${GROUP[@]}" --prune
          EXPECTED_SHA="$(git rev-parse "origin/${GROUP[0]}")"
          for branch in "${GROUP[@]}"; do
            SHA="$(git rev-parse "origin/${branch}")"
            printf '%s=%s\n' "$branch" "$SHA"
            test "$SHA" = "$EXPECTED_SHA"
          done
