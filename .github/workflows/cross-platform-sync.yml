name: Canonical Branch Mirror

on:
  push:
    branches:
      - main
      - macos
      - windows
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-branch-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep main, macos and windows on one canonical commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main macos windows --prune

          SOURCE_BRANCH="${GITHUB_REF_NAME}"
          case "$SOURCE_BRANCH" in
            main|macos|windows) ;;
            *)
              echo "Unsupported source branch: $SOURCE_BRANCH" >&2
              exit 1
              ;;
          esac

          SOURCE_SHA="$(git rev-parse "origin/${SOURCE_BRANCH}")"
          echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"

          for branch in main macos windows; do
            [ "$branch" = "$SOURCE_BRANCH" ] && continue
            TARGET_SHA="$(git rev-parse "origin/${branch}")"

            if [ "$TARGET_SHA" = "$SOURCE_SHA" ]; then
              continue
            fi

            # The mirror workflow never invents conflict resolutions and never
            # overwrites independent work. A normal one-branch change must be a
            # fast-forward from the other two canonical refs.
            if ! git merge-base --is-ancestor "$TARGET_SHA" "$SOURCE_SHA"; then
              echo "Refusing to overwrite diverged branch ${branch}." >&2
              echo "${branch}: ${TARGET_SHA}" >&2
              echo "${SOURCE_BRANCH}: ${SOURCE_SHA}" >&2
              echo "Reconcile the commits into main first, then rerun mirror." >&2
              exit 1
            fi
          done

          refs=()
          for branch in main macos windows; do
            [ "$branch" = "$SOURCE_BRANCH" ] && continue
            refs+=("${SOURCE_SHA}:refs/heads/${branch}")
          done

          # Update the other two refs as one atomic operation. Pushes made with
          # GITHUB_TOKEN do not recursively trigger this workflow, preventing
          # branch-sync loops.
          git push --atomic origin "${refs[@]}"

          git fetch origin main macos windows --prune
          MAIN_SHA="$(git rev-parse origin/main)"
          MACOS_SHA="$(git rev-parse origin/macos)"
          WINDOWS_SHA="$(git rev-parse origin/windows)"

          printf 'main=%s\nmacos=%s\nwindows=%s\n' "$MAIN_SHA" "$MACOS_SHA" "$WINDOWS_SHA"
          test "$MAIN_SHA" = "$MACOS_SHA"
          test "$MAIN_SHA" = "$WINDOWS_SHA"
