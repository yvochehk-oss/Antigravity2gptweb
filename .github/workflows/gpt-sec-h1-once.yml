name: GPT SEC-H1 one-shot hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden-rag-legacy-routes:
    if: startsWith(github.event.head_commit.message, 'chore(sec): run one-shot RAG legacy hardening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired Project Master mutation code
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import ast

          path = Path('source_code/0.2_RAG系统/project-rag-v1.1/app/legacy_routes.py')
          text = path.read_text(encoding='utf-8')
          original = text

          def cut_between(source: str, start: str, end: str) -> str:
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f'missing start marker: {start}')
              end_index = source.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'missing end marker: {end}')
              return source[:start_index] + source[end_index:]

          text = cut_between(
              text,
              '@app.post("/api/v1/projects")\n',
              '@app.get("/api/v1/projects/{project_id}")\n',
          )
          text = cut_between(
              text,
              '_PROJECT_PURGE_SECONDARY_SQL = (\n',
              '@app.get("/api/v1/projects/{project_id}/audit")\n',
          )
          text = cut_between(
              text,
              '@app.post("/projects")\n',
              '@app.get("/projects/{project_ref}", response_class=HTMLResponse)\n',
          )

          for obsolete in (
              'import hashlib\n',
              'import hmac\n',
              '    ProjectCreate,\n',
              '    ProjectDeleteRequest,\n',
              '    ProjectSync,\n',
              'from .user_center.db import UserCenterSessionLocal\n',
              'from .user_center.models import UserAccount\n',
              'from .user_center.security import verify_password\n',
          ):
              text = text.replace(obsolete, '')

          if 'IntegrityError' not in text.replace('from sqlalchemy.exc import IntegrityError\n', ''):
              text = text.replace('from sqlalchemy.exc import IntegrityError\n', '')

          forbidden_literals = ('888888', 'admin123', '123456', 'cdjg@2026', 'Admin@2026')
          leaked = [value for value in forbidden_literals if value in text]
          if leaked:
              raise SystemExit(f'forbidden hard-coded credentials remain: {leaked}')

          forbidden_routes = (
              '@app.post("/api/v1/projects")',
              '@app.post("/api/v1/projects/sync")',
              '@app.delete("/api/v1/projects/{project_id}")',
              '@app.post("/api/v1/projects/{project_id}/delete")',
              '@app.post("/projects")',
          )
          remaining_routes = [route for route in forbidden_routes if route in text]
          if remaining_routes:
              raise SystemExit(f'forbidden Project Master routes remain: {remaining_routes}')

          if text == original:
              raise SystemExit('legacy_routes.py did not change')

          ast.parse(text, filename=str(path))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify boundary and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile 'source_code/0.2_RAG系统/project-rag-v1.1/app/legacy_routes.py'
          ! grep -RniE '888888|admin123|123456|cdjg@2026|Admin@2026' 'source_code/0.2_RAG系统/project-rag-v1.1/app' --include='*.py'
          ! grep -nE '@app\.(post|delete)\("/api/v1/projects|@app\.post\("/projects"' 'source_code/0.2_RAG系统/project-rag-v1.1/app/legacy_routes.py'
          git rm '.github/workflows/gpt-sec-h1-once.yml'

      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'openai-gpt'
          git config user.email 'openai-gpt@users.noreply.github.com'
          git add 'source_code/0.2_RAG系统/project-rag-v1.1/app/legacy_routes.py'
          git diff --cached --check
          git commit -m 'refactor(rag): remove legacy project master mutation code'
          git push origin HEAD:main
