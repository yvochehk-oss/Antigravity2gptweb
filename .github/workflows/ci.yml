name: V2 CI Gate

on:
  push:
    branches:
      - main
      - v3.0
      - v3.0-macos
      - v3.0-windows
  pull_request:
    branches:
      - main
      - v3.0
      - v3.0-macos
      - v3.0-windows
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tax:
    name: Tax - lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectrag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/projectrag_test
      APP_ENV: test

    defaults:
      run:
        working-directory: source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        # pyproject.toml is authoritative; this also refreshes a stale lock
        # after dependency-policy changes instead of silently using it.
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Run PostgreSQL integration tests
        run: >
          uv run pytest
          tests/test_postgresql_schema.py
          tests/test_tax_ledger_routes.py
          -v --tb=short
          2>&1 | tee pytest.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-test-logs
          path: pytest.log
          retention-days: 5

  rag:
    name: RAG - lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectrag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/projectrag_test
      APP_ENV: test
      PROJECT_RAG_EMBEDDING_BACKEND: hash_v1
      PROJECT_RAG_RERANKER_BACKEND: off
      PROJECT_RAG_AUTO_START_WORKER: "0"

    defaults:
      run:
        working-directory: source_code/0.2_RAG系统/project-rag-v1.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  boss-app:
    name: Boss App - lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: source_code/0.3_老板端安卓App_天府掌舵

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source_code/0.3_老板端安卓App_天府掌舵/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  idp:
    name: IDP - static check & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: source_code/0.4_IDP文档录入引擎_V3.0

    env:
      APP_ENV: test
      # Unit/API tests use a disabled persistence path unless a test explicitly
      # provides a repository double; no live database is touched in CI.
      DATABASE_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev-v3.txt

      - name: Python compile check
        run: python -m compileall -q app tests

      - name: Pytest
        run: pytest -q
