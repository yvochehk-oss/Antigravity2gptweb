name: One-shot SSOT semantic hardening

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/one-shot-ssot-semantic-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Harden business keys and accounting semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          rag_root = Path('source_code/0.2_RAG系统/project-rag-v1.1')
          tax_root = Path('source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0')

          canonical = rag_root / 'app/services/canonical_facts.py'
          rag_tests = rag_root / 'tests/test_canonical_facts.py'
          whitepaper = rag_root / 'docs/RAG_TAX_SSOT_ARCHITECTURE.md'
          tax_service = tax_root / 'app/services/canonical_ssot.py'
          tax_tests = tax_root / 'tests/test_canonical_ssot.py'

          text = canonical.read_text(encoding='utf-8')
          old = '''_MAX_FACT_TEXT_CHARS = 300_000\n'''
          new = '''_MAX_FACT_TEXT_CHARS = 300_000\n_FACT_SCHEMA_VERSION = "v1"\n_VALIDATION_POLICY_VERSION = "v1"\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('canonical constants anchor not found')
              text = text.replace(old, new, 1)

          old = '''def _business_key(doc: Document, fact_type: str, fields: dict[str, Any]) -> str:\n    if fact_type == "contract":\n        return _clean(fields.get("contract_no")) or f"document:{doc.id}:contract"\n    if fact_type == "invoice":\n        return _clean(fields.get("invoice_no")) or f"document:{doc.id}:invoice"\n    pieces = [\n        _clean(fields.get("payment_date")),\n        _clean(fields.get("payer_entity_code")),\n        _clean(fields.get("payee_entity_code")),\n        _clean(fields.get("amount")),\n        _clean(fields.get("payer_bank_reference") or fields.get("payee_bank_reference")),\n    ]\n    material = "|".join(pieces)\n    return "payment:" + hashlib.sha256(material.encode("utf-8")).hexdigest()[:32]\n'''
          new = '''def _business_key(doc: Document, fact_type: str, fields: dict[str, Any]) -> str:\n    if fact_type == "contract":\n        return _clean(fields.get("contract_no")) or f"document:{doc.id}:contract"\n    if fact_type == "invoice":\n        invoice_no = _clean(fields.get("invoice_no"))\n        seller = _canonical_party(fields.get("seller_entity_code") or fields.get("seller_code"))\n        invoice_code = _clean(fields.get("invoice_code")) or "-"\n        if invoice_no and seller:\n            return f"invoice:{seller}:{invoice_code}:{invoice_no}"\n        return f"document:{doc.id}:invoice"\n\n    # Two legitimate transfers can have the same date, parties and amount.\n    # Only a bank reference is strong enough for cross-document dedupe; without\n    # one, keep document identity so the SSOT never silently merges cash facts.\n    reference = _clean(fields.get("payer_bank_reference") or fields.get("payee_bank_reference"))\n    if not reference:\n        return f"document:{doc.id}:payment"\n    pieces = [\n        _clean(fields.get("payment_date")),\n        _clean(fields.get("payer_entity_code")),\n        _clean(fields.get("payee_entity_code")),\n        _clean(fields.get("amount")),\n        reference,\n    ]\n    material = "|".join(pieces)\n    return "payment:" + hashlib.sha256(material.encode("utf-8")).hexdigest()[:32]\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('business key anchor not found')
              text = text.replace(old, new, 1)

          old = '''    stable = {\n        "document_file_hash": _clean(getattr(doc, "file_hash", "")),\n        "fact_type": fact_type,\n        "payload": payload,\n    }\n'''
          new = '''    stable = {\n        "document_file_hash": _clean(getattr(doc, "file_hash", "")),\n        "fact_type": fact_type,\n        "schema_version": _FACT_SCHEMA_VERSION,\n        "validation_policy_version": _VALIDATION_POLICY_VERSION,\n        "payload": payload,\n    }\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('source hash anchor not found')
              text = text.replace(old, new, 1)
          canonical.write_text(text, encoding='utf-8')

          text = rag_tests.read_text(encoding='utf-8')
          additions = '''\n\ndef test_payment_without_bank_reference_keeps_document_identity() -> None:\n    fields = {\n        "direction": "out",\n        "payer_entity_code": "A08",\n        "payee_entity_code": "ED",\n        "payment_date": "2026-09-01",\n        "amount": 1000,\n    }\n    first = build_candidate(_doc(id=101, document_type="payment"), "payment", fields)\n    second = build_candidate(_doc(id=102, document_type="payment"), "payment", fields)\n    assert first.status == "accepted"\n    assert second.status == "accepted"\n    assert first.business_key == "document:101:payment"\n    assert second.business_key == "document:102:payment"\n\n\ndef test_invoice_business_key_is_scoped_by_canonical_seller() -> None:\n    fields = {\n        "direction": "in",\n        "invoice_no": "00012345",\n        "invoice_code": "5100",\n        "net_amount": 1000,\n        "vat_amount": 130,\n        "total_amount": 1130,\n        "validation_status": "VALID",\n    }\n    eb = build_candidate(\n        _doc(document_type="invoice", counterparty_code="EB", invoice_no="00012345", tax_vat_input=130),\n        "invoice",\n        fields,\n    )\n    ea = build_candidate(\n        _doc(document_type="invoice", counterparty_code="EA", invoice_no="00012345", tax_vat_input=130),\n        "invoice",\n        fields,\n    )\n    assert eb.status == "accepted"\n    assert ea.status == "accepted"\n    assert eb.business_key != ea.business_key\n    assert eb.business_key.startswith("invoice:EB:")\n    assert ea.business_key.startswith("invoice:EA:")\n'''
          if 'def test_payment_without_bank_reference_keeps_document_identity' not in text:
              text += additions
          rag_tests.write_text(text, encoding='utf-8')

          text = tax_service.read_text(encoding='utf-8')
          text = text.replace(
              '''        "true_profit": external_revenue - external_cost,\n''',
              '''        "boundary_margin": external_revenue - external_cost,\n''',
              1,
          )
          old = '''            "calculation_version": "canonical-boundary-pnl-v1",\n'''
          new = '''            "basis": "accepted_invoice_facts",\n            "is_final_profit": False,\n            "limitations": [\n                "invoice boundary metric only; completion progress and unbilled accruals are not included",\n                "settlement adjustments and book-tax differences require later deterministic layers",\n            ],\n            "calculation_version": "canonical-boundary-pnl-v1",\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('Tax result qualification anchor not found')
              text = text.replace(old, new, 1)
          tax_service.write_text(text, encoding='utf-8')

          text = tax_tests.read_text(encoding='utf-8')
          text = text.replace('result["true_profit"]', 'result["boundary_margin"]')
          tax_tests.write_text(text, encoding='utf-8')

          text = whitepaper.read_text(encoding='utf-8')
          old = '''本阶段 `canonical_ssot.build_consolidated_project_pnl()` 先对 accepted invoice facts 完成 `external_revenue / external_cost / internal_eliminated / true_profit` 边界合并。后续履约、结算、未票成本、税会差异继续叠加在同一 lineage 上，而不是改变事实源。'''
          new = '''本阶段 `canonical_ssot.build_consolidated_project_pnl()` 先对 accepted invoice facts 完成 `external_revenue / external_cost / internal_eliminated / boundary_margin` 边界合并。`boundary_margin` 是发票事实口径的系统边界指标，不等同于最终会计净利润；最终“真实净利润”必须再叠加完工进度/收入确认、已发生未票成本、结算调整、资产化/费用化以及税会差异等确定性层。后续这些计算继续沿用同一 fact lineage，而不是改变事实源。'''
          if new not in text:
              if old not in text:
                  raise SystemExit('whitepaper P&L qualification anchor not found')
              text = text.replace(old, new, 1)
          whitepaper.write_text(text, encoding='utf-8')

          for path in (canonical, rag_tests, tax_service, tax_tests):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY

      - name: Commit semantic hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'source_code/0.2_RAG系统/project-rag-v1.1/app/services/canonical_facts.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/tests/test_canonical_facts.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/docs/RAG_TAX_SSOT_ARCHITECTURE.md' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/services/canonical_ssot.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/tests/test_canonical_ssot.py'
          git commit -m "fix(ssot): harden fact identity and qualify boundary profit semantics"
          git pull --rebase origin v3.0-macos
          git push origin HEAD:v3.0-macos
