name: Systemic project resilience once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/systemic-project-resilience-once.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply systemic resilience patch
        run: python scripts/apply_systemic_project_resilience.py

      - name: Static Python verification
        working-directory: source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0
        run: |
          python -m py_compile app/services/canonical_project_summary.py app/routers/api.py
          grep -R "_PRIMARY_CONTRACT_CODES" app/services/canonical_project_summary.py && exit 1 || true
          grep -q 'MULTIPLE_BOUNDARY_MAX_AMOUNT' app/services/canonical_project_summary.py
          grep -q '@router.get("/api/projects")' app/routers/api.py

      - name: Install backend test dependencies
        working-directory: source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0
        run: pip install -q -r requirements.txt

      - name: Run targeted backend tests
        working-directory: source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0
        run: pytest -q tests/test_canonical_project_summary.py

      - name: Build frontend
        working-directory: source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch
        run: |
          npm install --no-package-lock
          npm run build

      - name: Sync frontend dist to backend static_dist
        run: |
          set -euo pipefail
          src='source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/dist/'
          dst='source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/static_dist/'
          rsync -a --delete "$src" "$dst"

      - name: Commit final upgrade and self-clean
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/systemic-project-resilience-once.yml' 'scripts/apply_systemic_project_resilience.py'
          git add \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/services/canonical_project_summary.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/routers/api.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/tests/test_canonical_project_summary.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/src/api.ts' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/src/types.ts'
          git add -f 'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/static_dist'
          git diff --cached --check
          git commit -m 'feat(tax): make project summaries systemically resilient'
          git push origin HEAD:main
