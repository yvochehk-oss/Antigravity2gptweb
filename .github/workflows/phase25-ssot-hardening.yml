name: Phase 2.5 SSOT Hardening

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/phase25-ssot-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Apply Phase 2.5 patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          RAG = Path('source_code/0.2_RAG系统/project-rag-v1.1')
          TAX = Path('source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0')
          FRONT = Path('source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch')

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'patch target not found: {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: Path, pattern: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'regex patch count={count}: {path}: {pattern[:100]!r}')
              path.write_text(updated, encoding='utf-8')

          # P0: Tax deletion must never own or delete RAG canonical facts/outbox.
          api_py = TAX / 'app/routers/api.py'
          text = api_py.read_text(encoding='utf-8')
          if 'from ..services.canonical_ledger import project_counterparties as load_canonical_counterparties' not in text:
              text = text.replace(
                  'from ..models import (\n',
                  'from ..services.canonical_ledger import project_counterparties as load_canonical_counterparties\nfrom ..models import (\n',
                  1,
              )
          preserve_anchor = '            "ingest_jobs",\n'
          if '            "canonical_facts",\n' not in text:
              if preserve_anchor not in text:
                  raise RuntimeError('rag_preserve_tables anchor not found')
              text = text.replace(
                  preserve_anchor,
                  preserve_anchor + '            "canonical_facts",\n            "canonical_fact_outbox",\n',
                  1,
              )
          api_py.write_text(text, encoding='utf-8')

          # Compatibility URL now delegates to the Canonical read model as well.
          regex_once(
              api_py,
              r'@router\.get\("/api/projects/\{pid\}/counterparties"\)\ndef api_project_counterparties\(pid: int, _user=_reader_dependency\):.*?(?=\n\n@router\.(?:post|delete)\("/api/projects/\{pid\}/delete-data"\))',
              '''@router.get("/api/projects/{pid}/counterparties")
          def api_project_counterparties(pid: int, _user=_reader_dependency):
              """Compatibility endpoint backed only by accepted/current Canonical Facts."""
              db = SessionLocal()
              try:
                  if db.get(Project, pid) is None:
                      raise HTTPException(status_code=404, detail="项目不存在")
                  return load_canonical_counterparties(db, pid)
              except HTTPException:
                  db.rollback()
                  raise
              except Exception:
                  db.rollback()
                  _LOGGER.exception("canonical counterparty aggregation failed: pid=%s", pid)
                  raise
              finally:
                  db.close()
          ''',
          )

          # Phase 2.5 DB-level constraints and business-version uniqueness.
          migration = RAG / 'migrations/20260902_canonical_facts_phase25_hardening.sql'
          migration.write_text('''ALTER TABLE canonical_facts
          DROP CONSTRAINT IF EXISTS ck_canonical_facts_current_requires_accepted;
          ALTER TABLE canonical_facts
          ADD CONSTRAINT ck_canonical_facts_current_requires_accepted
          CHECK (NOT is_current OR status = 'accepted');

          ALTER TABLE canonical_facts
          DROP CONSTRAINT IF EXISTS ck_canonical_facts_accepted_requires_timestamp;
          ALTER TABLE canonical_facts
          ADD CONSTRAINT ck_canonical_facts_accepted_requires_timestamp
          CHECK (status <> 'accepted' OR accepted_at IS NOT NULL);

          CREATE UNIQUE INDEX IF NOT EXISTS uq_canonical_fact_business_version
              ON canonical_facts(project_id, fact_type, business_key, fact_version);
          ''', encoding='utf-8')

          # Existing migration runner now applies baseline + Phase 2.5 hardening atomically.
          apply_script = RAG / 'scripts/apply_canonical_facts_ssot.py'
          replace_once(
              apply_script,
              'SQL_PATH = PROJECT_ROOT / "migrations" / "20260901_canonical_facts_ssot.sql"\n',
              'SQL_PATHS = (\n    PROJECT_ROOT / "migrations" / "20260901_canonical_facts_ssot.sql",\n    PROJECT_ROOT / "migrations" / "20260902_canonical_facts_phase25_hardening.sql",\n)\n',
          )
          regex_once(
              apply_script,
              r'def main\(\) -> None:\n.*?\n\nif __name__ == "__main__":',
              '''def main() -> None:
              with engine.begin() as conn:
                  for sql_path in SQL_PATHS:
                      sql = sql_path.read_text(encoding="utf-8")
                      for statement in _statements(sql):
                          conn.exec_driver_sql(statement)
              print(f"canonical facts SSOT migrations applied: {len(SQL_PATHS)}")


          if __name__ == "__main__":''',
          )

          # P1 identity fail-closed + stale replay/version hardening.
          canonical = RAG / 'app/services/canonical_facts.py'
          replace_once(canonical, 'from dataclasses import dataclass\n', 'from dataclasses import dataclass, replace\n')

          identity_block = '''def _canonical_name_party(value: Any) -> str:
              preset = get_external_preset(_clean(value))
              return str(preset["code"]).upper() if preset else ""


          def _merge_party_identity(
              fields: dict[str, Any],
              prefix: str,
              document_code: Any = "",
          ) -> None:
              """Merge document/code/name identity while recording every contradiction.

              Document metadata is authoritative only when it agrees with any explicit
              extracted canonical code and any known legal-name alias.  Contradictions
              are preserved as validation errors so the candidate becomes needs_review.
              """
              code_key = f"{prefix}_entity_code"
              generic_key = f"{prefix}_code"
              name_key = f"{prefix}_name"

              raw_extracted = _clean(fields.get(code_key) or fields.get(generic_key))
              extracted_code = _canonical_party(raw_extracted)
              document_canonical = _canonical_party(document_code)
              legal_name = _clean(fields.get(name_key))
              legal_name_code = _canonical_name_party(legal_name)

              conflicts = fields.setdefault("_identity_conflicts", [])
              if raw_extracted and not extracted_code:
                  conflicts.append(
                      f"{prefix} extracted code {raw_extracted!r} is not a canonical identity"
                  )

              observations = {
                  "document": document_canonical,
                  "extracted": extracted_code,
                  "legal_name": legal_name_code,
              }
              distinct = {code for code in observations.values() if code}
              if len(distinct) > 1:
                  detail = "; ".join(
                      f"{label}={code or '-'}" for label, code in observations.items()
                  )
                  conflicts.append(f"{prefix} identity conflict: {detail}")

              chosen = document_canonical or extracted_code or legal_name_code
              if chosen:
                  fields[code_key] = chosen
                  fields[generic_key] = chosen
              if not conflicts:
                  fields.pop("_identity_conflicts", None)


          def _apply_document_identity(doc: Document, fact_type: str, fields: dict[str, Any]) -> dict[str, Any]:
              out = dict(fields or {})
              entity_code = _canonical_party(getattr(doc, "entity_code", ""))
              counterparty_code = _canonical_party(getattr(doc, "counterparty_code", ""))

              if fact_type == "contract":
                  if getattr(doc, "contract_no", ""):
                      out.setdefault("contract_no", doc.contract_no)
                  _merge_party_identity(out, "party_a", entity_code)
                  _merge_party_identity(out, "party_b", counterparty_code)

              elif fact_type == "invoice":
                  direction = _clean(out.get("direction")).lower()
                  if not direction:
                      if float(getattr(doc, "tax_vat_input", 0) or 0) > 0:
                          direction = "in"
                      elif float(getattr(doc, "tax_vat_output", 0) or 0) > 0:
                          direction = "out"
                      if direction:
                          out["direction"] = direction
                  if getattr(doc, "invoice_no", ""):
                      out.setdefault("invoice_no", doc.invoice_no)
                  if getattr(doc, "invoice_date", ""):
                      out.setdefault("invoice_date", doc.invoice_date)
                  if direction == "in":
                      _merge_party_identity(out, "buyer", entity_code)
                      _merge_party_identity(out, "seller", counterparty_code)
                  elif direction == "out":
                      _merge_party_identity(out, "seller", entity_code)
                      _merge_party_identity(out, "buyer", counterparty_code)
                  else:
                      _merge_party_identity(out, "seller")
                      _merge_party_identity(out, "buyer")

              elif fact_type == "payment":
                  direction = _clean(out.get("direction")).lower()
                  if direction == "out":
                      _merge_party_identity(out, "payer", entity_code)
                      _merge_party_identity(out, "payee", counterparty_code)
                  elif direction == "in":
                      _merge_party_identity(out, "payee", entity_code)
                      _merge_party_identity(out, "payer", counterparty_code)
                  else:
                      _merge_party_identity(out, "payer")
                      _merge_party_identity(out, "payee")
                  if getattr(doc, "contract_no", ""):
                      out.setdefault("contract_no", doc.contract_no)

              return out


          def _business_key'''
          regex_once(
              canonical,
              r'def _backfill_party_from_name\(.*?\n\ndef _business_key',
              identity_block,
          )

          replace_once(
              canonical,
              '    if fields.get("_extraction_error"):\n        errors.append(str(fields["_extraction_error"]))\n',
              '    if fields.get("_extraction_error"):\n        errors.append(str(fields["_extraction_error"]))\n    for item in fields.get("_identity_conflicts") or []:\n        errors.append(str(item))\n',
          )

          persist_block = '''def _acquire_business_key_lock(db, project_id: int, fact_type: str, business_key: str) -> None:
              """Serialize one business identity before version/current transitions."""
              try:
                  bind = db.get_bind()
              except Exception:
                  bind = getattr(db, "bind", None)
              dialect = getattr(getattr(bind, "dialect", None), "name", "")
              if dialect == "postgresql":
                  lock_key = f"canonical_fact|{project_id}|{fact_type}|{business_key}"
                  db.execute(
                      text(
                          "SELECT pg_advisory_xact_lock("
                          "hashtextextended(CAST(:lock_key AS text), 0))"
                      ),
                      {"lock_key": lock_key},
                  )


          def _stale_replay_candidate(doc: Document, candidate: CanonicalFactCandidate) -> CanonicalFactCandidate:
              reason = "stale source document replay blocked; current higher version retained"
              confidence = Decimal(str(getattr(doc, "metadata_confidence", 0) or 0))
              confidence = min(Decimal("0.99999"), max(Decimal("0"), confidence))
              return replace(
                  candidate,
                  status="needs_review",
                  validation_errors=list(dict.fromkeys([*candidate.validation_errors, reason])),
                  confidence=confidence,
              )


          def _persist_candidate(db, doc: Document, candidate: CanonicalFactCandidate) -> int:
              _acquire_business_key_lock(
                  db,
                  int(doc.project_id),
                  candidate.fact_type,
                  candidate.business_key,
              )

              existing = db.execute(
                  text(
                      "SELECT id, fact_version, status, is_current FROM canonical_facts "
                      "WHERE source_document_id=:document_id AND fact_type=:fact_type AND source_hash=:source_hash "
                      "FOR UPDATE"
                  ),
                  {"document_id": doc.id, "fact_type": candidate.fact_type, "source_hash": candidate.source_hash},
              ).mappings().first()

              if existing and existing["status"] == candidate.status:
                  return int(existing["id"])

              # A source that has already been superseded is historical evidence.
              # Exact replay must never reactivate it as current.
              if existing and existing["status"] == "superseded":
                  return int(existing["id"])

              current = db.execute(
                  text(
                      "SELECT id, fact_version, source_document_id, source_hash FROM canonical_facts "
                      "WHERE project_id=:project_id AND fact_type=:fact_type AND business_key=:business_key "
                      "AND status='accepted' AND is_current=TRUE FOR UPDATE"
                  ),
                  {
                      "project_id": doc.project_id,
                      "fact_type": candidate.fact_type,
                      "business_key": candidate.business_key,
                  },
              ).mappings().first()

              prior_superseded_version = int(
                  db.execute(
                      text(
                          "SELECT COALESCE(MAX(fact_version), 0) FROM canonical_facts "
                          "WHERE source_document_id=:document_id AND project_id=:project_id "
                          "AND fact_type=:fact_type AND business_key=:business_key "
                          "AND status='superseded'"
                      ),
                      {
                          "document_id": doc.id,
                          "project_id": doc.project_id,
                          "fact_type": candidate.fact_type,
                          "business_key": candidate.business_key,
                      },
                  ).scalar_one()
              )

              if (
                  candidate.status == "accepted"
                  and current
                  and int(current["source_document_id"]) != int(doc.id)
                  and prior_superseded_version > 0
              ):
                  candidate = _stale_replay_candidate(doc, candidate)

              if existing:
                  fact_version = int(existing["fact_version"])
              else:
                  fact_version = int(
                      db.execute(
                          text(
                              "SELECT COALESCE(MAX(fact_version), 0) FROM canonical_facts "
                              "WHERE project_id=:project_id AND fact_type=:fact_type AND business_key=:business_key"
                          ),
                          {"project_id": doc.project_id, "fact_type": candidate.fact_type, "business_key": candidate.business_key},
                      ).scalar_one()
                  ) + 1

              if candidate.status == "accepted":
                  db.execute(
                      text(
                          "UPDATE canonical_facts SET status='superseded', is_current=FALSE, updated_at=now() "
                          "WHERE project_id=:project_id AND fact_type=:fact_type AND business_key=:business_key "
                          "AND status='accepted' AND is_current=TRUE "
                          "AND NOT (source_document_id=:document_id AND source_hash=:source_hash)"
                      ),
                      {
                          "project_id": doc.project_id,
                          "fact_type": candidate.fact_type,
                          "business_key": candidate.business_key,
                          "document_id": doc.id,
                          "source_hash": candidate.source_hash,
                      },
                  )

              row_id = db.execute(
                  text(
                      "INSERT INTO canonical_facts ("
                      "source_document_id, project_id, fact_type, business_key, schema_version, fact_version, source_hash, "
                      "payload, evidence, validation_errors, confidence, status, is_current, producer, accepted_at"
                      ") VALUES ("
                      ":document_id, :project_id, :fact_type, :business_key, 'v1', :fact_version, :source_hash, "
                      "CAST(:payload AS jsonb), CAST(:evidence AS jsonb), CAST(:errors AS jsonb), :confidence, :status, :is_current, "
                      "'rag_worker:deterministic-v1', CASE WHEN CAST(:status AS varchar)='accepted' THEN now() ELSE NULL END"
                      ") ON CONFLICT (source_document_id, fact_type, source_hash) DO UPDATE SET "
                      "payload=EXCLUDED.payload, evidence=EXCLUDED.evidence, validation_errors=EXCLUDED.validation_errors, "
                      "confidence=EXCLUDED.confidence, status=EXCLUDED.status, is_current=EXCLUDED.is_current, "
                      "accepted_at=CASE WHEN EXCLUDED.status='accepted' THEN COALESCE(canonical_facts.accepted_at, now()) ELSE NULL END, "
                      "updated_at=now() RETURNING id"
                  ),
                  {
                      "document_id": doc.id,
                      "project_id": doc.project_id,
                      "fact_type": candidate.fact_type,
                      "business_key": candidate.business_key,
                      "fact_version": fact_version,
                      "source_hash": candidate.source_hash,
                      "payload": json.dumps(candidate.payload, ensure_ascii=False, default=str),
                      "evidence": json.dumps(candidate.evidence, ensure_ascii=False, default=str),
                      "errors": json.dumps(candidate.validation_errors, ensure_ascii=False),
                      "confidence": candidate.confidence,
                      "status": candidate.status,
                      "is_current": candidate.status == "accepted",
                  },
              ).scalar_one()

              if candidate.status == "accepted":
                  db.execute(
                      text(
                          "INSERT INTO canonical_fact_outbox (fact_id, event_type, payload) "
                          "VALUES (:fact_id, 'canonical_fact.accepted', CAST(:payload AS jsonb)) "
                          "ON CONFLICT (fact_id, event_type) DO NOTHING"
                      ),
                      {
                          "fact_id": row_id,
                          "payload": json.dumps(
                              {"project_id": doc.project_id, "fact_type": candidate.fact_type, "business_key": candidate.business_key},
                              ensure_ascii=False,
                          ),
                      },
                  )
              return int(row_id)


          def promote_document_to_canonical_facts'''
          regex_once(
              canonical,
              r'def _persist_candidate\(.*?\n\ndef promote_document_to_canonical_facts',
              persist_block,
          )

          # Disable old Tax-side master-data creation/import route at the server boundary.
          rag_sync = TAX / 'app/routers/rag_sync.py'
          regex_once(
              rag_sync,
              r'@router\.post\("/pending/\{pending_id\}/confirm-contract-and-create-parties"\)\ndef confirm_contract_and_create_parties\(.*?(?=\n\n@router\.)',
              '''@router.post("/pending/{pending_id}/confirm-contract-and-create-parties")
          def confirm_contract_and_create_parties(
              pending_id: int,
              payload: ConfirmPendingContractRequest,
              request: Request,
          ):
              """Phase 2.5 hard stop for the obsolete Tax-side master-data write path."""
              admin_only(request)
              _ = (pending_id, payload)
              raise HTTPException(
                  status_code=410,
                  detail=(
                      "Phase 2.5 已启用 Canonical Facts 单一事实源；"
                      "Tax 不再允许手动创建外部交易方并导入合同。"
                  ),
              )
          ''',
          )

          # Frontend reads canonical endpoint directly and blocks the legacy helper locally.
          api_ts = FRONT / 'src/api.ts'
          replace_once(
              api_ts,
              '`/api/projects/${projectId}/counterparties`',
              '`/api/v1/canonical-ssot/projects/${projectId}/counterparties`',
          )
          regex_once(
              api_ts,
              r'export async function confirmRagPendingContractAndCreateParties\(pendingId: number\): Promise<RagConfirmPendingContractResult> \{.*?\n\}',
              '''export async function confirmRagPendingContractAndCreateParties(pendingId: number): Promise<RagConfirmPendingContractResult> {
              if (!positiveInteger(pendingId)) throw new ApiError('待复核记录必须是有效 ID。', 400);
              throw new ApiError(
                  'Phase 2.5 已启用 Canonical Facts 单一事实源；Tax UI 不再允许手动创建外部交易方并导入合同。',
                  410,
              );
          }''',
          )

          modal = FRONT / 'src/components/NewTaxRecordModal.tsx'
          modal_text = modal.read_text(encoding='utf-8')
          modal_text = modal_text.replace('确认创建并导入？', '旧手工创建入口已停用')
          modal_text = modal_text.replace(
              '系统会使用服务器保存的名称与税号创建缺失的外部交易方，再导入此合同；浏览器填写内容不会参与主数据写入。',
              '该记录只能继续复核或忽略；交易方身份与合同事实统一由 Canonical Facts 自动归一化。',
          )
          confirm_button_pattern = re.compile(
              r'<button type="button" onClick=\{\(\) => void handleConfirmPendingContract\(item\.id\)\} disabled=\{busy\} className="px-3 py-1\.5 rounded-lg bg-\[#EF4444\] text-white font-bold text-\[12px\] disabled:opacity-40">\{confirmingPendingId === item\.id \? \'确认处理中…\' : \'确认创建并导入\'\}</button>'
          )
          modal_text, count = confirm_button_pattern.subn(
              '<span className="px-3 py-1.5 rounded-lg bg-[#334155]/50 text-[#cbd5e1] text-[12px]">已停用</span>',
              modal_text,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'confirm modal button patch count={count}')
          old_main = '<button type="button" onClick={() => { setConfirmPendingId(item.id); setConfirmRejectPendingId(null); }} disabled={busy} className="px-3 py-1.5 rounded-lg bg-[#F59E0B] text-[#231400] font-bold text-[12px] disabled:opacity-40 hover:bg-[#d97706] transition-colors">确认创建交易方并导入合同</button>'
          if old_main not in modal_text:
              raise RuntimeError('main manual-create button not found')
          modal_text = modal_text.replace(
              old_main,
              '<span className="px-3 py-1.5 rounded-lg border border-[#10B981]/30 bg-[#10B981]/10 text-[#b6f4d8] text-[12px]">Canonical Facts 自动直通，无需手工创建交易方</span>',
              1,
          )
          modal.write_text(modal_text, encoding='utf-8')

          # Frontend tests: canonical endpoint + local 410 instead of legacy POST.
          api_test = FRONT / 'src/api.test.ts'
          test_text = api_test.read_text(encoding='utf-8')
          old_confirm = '''    const result = await confirmRagPendingContractAndCreateParties(41);
              assert.equal(result.recordId, 91);
              assert.equal(result.createdExternalParties[0].code, 'EXT-123');'''
          if old_confirm not in test_text:
              raise RuntimeError('frontend confirm test body not found')
          test_text = test_text.replace(
              old_confirm,
              '''    await assert.rejects(
                  () => confirmRagPendingContractAndCreateParties(41),
                  error => error instanceof ApiError && error.status === 410,
                );''',
              1,
          )
          old_requests = '''  assert.deepEqual(requests, [
              { path: '/rag-sync/pending?project_id=6&sync_type=contract&status=pending', body: undefined },
              { path: '/rag-sync/pending/41/confirm-contract-and-create-parties', body: { confirm: true } },
            ]);'''
          if old_requests not in test_text:
              raise RuntimeError('frontend legacy confirm request assertion not found')
          test_text = test_text.replace(
              old_requests,
              '''  assert.deepEqual(requests, [
              { path: '/rag-sync/pending?project_id=6&sync_type=contract&status=pending', body: undefined },
            ]);''',
              1,
          )
          # Update any direct endpoint assertion in the counterparty test.
          test_text = test_text.replace(
              '/api/projects/6/counterparties',
              '/api/v1/canonical-ssot/projects/6/counterparties',
          )
          api_test.write_text(test_text, encoding='utf-8')

          # Phase 2.5 RAG hardening tests.
          (RAG / 'tests/test_canonical_phase25_hardening.py').write_text('''from pathlib import Path
          from types import SimpleNamespace

          from app.services.canonical_facts import build_candidate


          def _doc(**overrides):
              values = {
                  "id": 301,
                  "project_id": 15,
                  "file_hash": "b" * 64,
                  "document_type": "contract",
                  "entity_code": "A08",
                  "counterparty_code": "ED",
                  "contract_no": "TF-A08-EXT-CRANE",
                  "invoice_no": "",
                  "invoice_date": "",
                  "tax_vat_input": 0,
                  "tax_vat_output": 0,
                  "metadata_confidence": 0.95,
              }
              values.update(overrides)
              return SimpleNamespace(**values)


          def test_document_code_vs_extracted_code_conflict_is_review_only() -> None:
              candidate = build_candidate(
                  _doc(),
                  "contract",
                  {
                      "party_b_entity_code": "EB",
                      "party_b_name": "重庆重交大件起重吊装工程有限公司",
                      "total_amount": 1000,
                  },
              )
              assert candidate.status == "needs_review"
              assert any("party_b identity conflict" in item for item in candidate.validation_errors)


          def test_extracted_code_vs_legal_name_alias_conflict_is_review_only() -> None:
              candidate = build_candidate(
                  _doc(counterparty_code=""),
                  "contract",
                  {
                      "party_b_entity_code": "EA",
                      "party_b_name": "攀钢集团攀枝花钢钒物资销售有限公司",
                      "total_amount": 1000,
                  },
              )
              assert candidate.status == "needs_review"
              assert any("party_b identity conflict" in item for item in candidate.validation_errors)


          def test_unknown_explicit_extracted_code_is_review_only() -> None:
              candidate = build_candidate(
                  _doc(counterparty_code=""),
                  "contract",
                  {
