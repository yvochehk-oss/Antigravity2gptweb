name: One-shot canonical external-party create hardening

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/one-shot-rag-tax-canonical-create-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Harden canonical create branch and aliases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          root = Path("source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0")
          sync = root / "app/routers/rag_sync.py"
          tests = root / "tests/test_rag_sync_contract_party_aliases.py"

          text = sync.read_text(encoding="utf-8")
          old = '''_EXTERNAL_PARTY_SEAL_NAME_TO_CODE = {\n    "四川省建筑科学研究院特种技术服务中心": "EA",\n    "攀钢集团攀枝花钢铁钒物资销售有限公司": "EB",\n    "重庆重交大件起重吊装工程有限公司": "ED",\n}\n'''
          new = '''_EXTERNAL_PARTY_SEAL_NAME_TO_CODE = {\n    "四川省建筑科学研究院特种技术服务中心": "EA",\n    "省建科院特种技术中心": "EA",\n    "中建西南地勘院": "EA",\n    "攀钢集团攀枝花钢铁钒物资销售有限公司": "EB",\n    "攀钢集团攀枝花钢钒物资销售有限公司": "EB",\n    "攀钢集团特种钢材直销部": "EB",\n    "攀钢钢钒物资": "EB",\n    "重庆重交大件起重吊装工程有限公司": "ED",\n    "重庆巨力重型起重设备吊装公司": "ED",\n    "重庆巨力吊装": "ED",\n}\n\n_EXTERNAL_PARTY_CANONICAL_KIND = {\n    "EA": "construction",\n    "EB": "trade",\n    "ED": "equipment",\n}\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Tax seal alias map anchor not found")

          anchor = '''        except SyncReviewRequired as exc:\n            if "未登记" not in exc.reason:\n                raise\n        # Need to create external party\n        tax_id_for_ext = raw_tax_id or (raw_code if not _is_internal_entity_code(db, raw_code) else "")\n'''
          replacement = '''        except SyncReviewRequired as exc:\n            if "未登记" not in exc.reason:\n                raise\n        # A reviewed, explicitly-known seal alias owns a canonical E* identity.\n        # If its master row is missing, create that canonical row directly; never\n        # hash the canonical code into a second EXT-* identity.\n        if alias_code:\n            same_code = _external_party_matches(db, "code", alias_code)\n            if len(same_code) > 1:\n                raise SyncReviewRequired(\n                    f"外部交易方 code={alias_code!r} 匹配不唯一"\n                )\n            if same_code:\n                continue\n            same_name = _external_party_matches(db, "name", name)\n            if same_name:\n                raise SyncReviewRequired(\n                    f"外部交易方名称 {name!r} 已登记但 canonical code 不一致"\n                )\n            party = ExternalParty(\n                code=alias_code,\n                name=name,\n                short_name=name[:60],\n                kind=_EXTERNAL_PARTY_CANONICAL_KIND.get(alias_code, "rag_confirmed"),\n                tax_id=raw_tax_id or None,\n                active=True,\n            )\n            db.add(party)\n            db.flush()\n            created.append(party)\n            continue\n        # Need to create an otherwise unknown external party.\n        tax_id_for_ext = raw_tax_id or (raw_code if not _is_internal_entity_code(db, raw_code) else "")\n'''
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif replacement not in text:
              raise SystemExit("Tax canonical create anchor not found")
          sync.write_text(text, encoding="utf-8")

          t = tests.read_text(encoding="utf-8")
          if "def test_confirm_missing_known_alias_creates_canonical_code" not in t:
              t += '''\n\ndef test_confirm_missing_known_alias_creates_canonical_code(monkeypatch) -> None:\n    created_rows = []\n\n    class _DB:\n        def add(self, row):\n            created_rows.append(row)\n        def flush(self):\n            pass\n\n    def _missing(db, raw=None, *, name=None, code=None, tax_id=None):\n        raise rag_sync.SyncReviewRequired(f"外部交易方 code={raw!r} 未登记")\n\n    monkeypatch.setattr(rag_sync, "_resolve_party_code", _missing)\n    monkeypatch.setattr(rag_sync, "_external_party_matches", lambda db, label, value: [])\n\n    fields = {\n        "party_b_entity_code": "EB",\n        "party_b_name": "攀钢集团攀枝花钢铁钒物资销售有限公司",\n    }\n    created = rag_sync._create_confirmed_external_parties(_DB(), fields)\n\n    assert len(created) == 1\n    assert created[0].code == "EB"\n    assert created[0].code.startswith("EXT-") is False\n    assert created[0].kind == "trade"\n    assert fields["party_b_code"] == "EB"\n'''
          tests.write_text(t, encoding="utf-8")

          ast.parse(sync.read_text(encoding="utf-8"), filename=str(sync))
          ast.parse(tests.read_text(encoding="utf-8"), filename=str(tests))
          PY

      - name: Commit and push hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/routers/rag_sync.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/tests/test_rag_sync_contract_party_aliases.py'
          git commit -m "fix(sync): create known contract counterparties with canonical codes"
          git pull --rebase origin v3.0-macos
          git push origin HEAD:v3.0-macos
