name: Apply Phase 2.5 Business Hardening

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/phase25-business-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Execute vetted Phase 2.5 patch body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/phase25-ssot-hardening.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit Phase 2.5 hardening and remove one-shot workflow"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script, count = re.subn(
              r'^\s*assert .*superseded.* in source$',
              '    assert "superseded" in source',
              script,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise RuntimeError(f'generated stale-replay assertion repair count={count}')
          exec(compile(script, '<phase25-business-apply>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Commit Phase 2.5 business changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'source_code/0.2_RAG系统/project-rag-v1.1/app/services/canonical_facts.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/migrations/20260902_canonical_facts_phase25_hardening.sql' \
            'source_code/0.2_RAG系统/project-rag-v1.1/scripts/apply_canonical_facts_ssot.py' \
            'source_code/0.2_RAG系统/project-rag-v1.1/tests/test_canonical_phase25_hardening.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/routers/api.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/routers/rag_sync.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/tests/test_phase25_ssot_hardening.py' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/src/api.ts' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/src/api.test.ts' \
            'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/src/components/NewTaxRecordModal.tsx'
          git diff --cached --check
          git commit -m "fix(ssot): harden Phase 2.5 ownership replay and identity boundaries"
          git push origin HEAD:v3.0-macos
