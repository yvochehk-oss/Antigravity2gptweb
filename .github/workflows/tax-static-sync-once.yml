name: Tax frontend static sync once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tax-static-sync-once.yml

permissions:
  contents: write

jobs:
  build-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch
        run: |
          npm install --no-package-lock
          npm run build

      - name: Sync dist to backend static_dist
        shell: bash
        run: |
          set -euo pipefail
          src='source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/frontend_stitch/dist/'
          dst='source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/static_dist/'
          rsync -a --delete "$src" "$dst"

      - name: Commit static sync and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/tax-static-sync-once.yml'
          git add 'source_code/0.1_税务管理/gtp_V1.0_FULL/01_当前完整系统_V1.0/chengdu_construction_tax_system_v1_0/app/static_dist'
          git diff --cached --check
          git commit -m 'chore(tax): sync rebuilt frontend static bundle'
          git push origin HEAD:main
