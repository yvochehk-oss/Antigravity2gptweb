name: One-shot SSOT psycopg status cast

on:
  push:
    branches:
      - v3.0-macos
    paths:
      - .github/workflows/one-shot-ssot-psycopg-status-cast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0-macos
          fetch-depth: 0

      - name: Fix psycopg3 status parameter type inference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('source_code/0.2_RAG系统/project-rag-v1.1/app/services/canonical_facts.py')
          text = path.read_text(encoding='utf-8')

          old = "\"'rag_worker:deterministic-v1', CASE WHEN :status='accepted' THEN now() ELSE NULL END\""
          new = "\"'rag_worker:deterministic-v1', CASE WHEN CAST(:status AS varchar)='accepted' THEN now() ELSE NULL END\""

          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one status CASE anchor, found {text.count(old)}')
              text = text.replace(old, new, 1)

          if "CASE WHEN CAST(:status AS varchar)='accepted' THEN now() ELSE NULL END" not in text:
              raise SystemExit('psycopg3 status cast was not applied')

          ast.parse(text, filename=str(path))
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'source_code/0.2_RAG系统/project-rag-v1.1/app/services/canonical_facts.py'
          git commit -m "fix(ssot): cast canonical fact status for psycopg3"
          git pull --rebase origin v3.0-macos
          git push origin HEAD:v3.0-macos
